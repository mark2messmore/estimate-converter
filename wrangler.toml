name = "purchase-req-helper"
main = "worker/index.js"
compatibility_date = "2026-05-01"

# Static frontend (www/) served by the Worker at non-/api paths
[assets]
directory = "./www"
binding = "ASSETS"

# Secrets (set via `npx wrangler secret put <NAME>`; for local dev, same names in `.dev.vars`):
#   ANTHROPIC_API_KEY   - required, the Anthropic key
#   TELEGRAM_BOT_TOKEN  - optional, enables daily model-retirement alerts
#   TELEGRAM_CHAT_ID    - optional, the recipient's numeric chat id
# Until the two TELEGRAM_* secrets are set, the cron check runs but stays silent.

# Daily model-health check at 13:00 UTC (~8am US Central). Fires the scheduled()
# handler, which Telegram-alerts only if the primary model has been retired.
[triggers]
crons = ["0 13 * * *"]
